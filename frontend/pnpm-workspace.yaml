# pnpm v11+: explicit approval for lifecycle scripts during install.
# See https://pnpm.io/cli/approve-builds
allowBuilds:
  core-js: true
  esbuild: set this to true or false
  sharp: true
  unrs-resolver: true

# pnpm 11 reads overrides from this file, not package.json.
overrides:
  "brace-expansion@<1.1.21": 1.1.21
  "js-yaml@>=4 <4.3.2": 4.3.2
  "nanoid@>=3 <3.3.18": 3.3.18
  "postcss@>=8 <8.5.23": 8.5.23
  "source-map-js@<1.2.2": 1.2.2
