name: "Recovery: add SSH key"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Restore VM SSH access
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Add recovery key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            install -d -m 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"

            recovery_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB6JLxROSgvLy7rxpp65NPEErQfFncc0QLzQAKzrOVBj gordey.zuev@gmail.com'
            grep -qxF "$recovery_key" "$HOME/.ssh/authorized_keys" \
              || printf '%s\n' "$recovery_key" >> "$HOME/.ssh/authorized_keys"

            echo "Recovery SSH key installed for $(whoami) on $(hostname)"
