# Bootstrap configuration used on the very first deploy, BEFORE the Let's Encrypt
# cert exists. It serves the ACME challenge over plain HTTP and proxies everything
# else to the app — this lets the site come up while certbot fetches its first
# certificate. After certbot writes /etc/letsencrypt/live/leap/{fullchain,privkey}.pem
# swap nginx.conf back in and reload nginx.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 5001M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        include /etc/nginx/leap-active/slot.conf;
        add_header X-Leap-Slot $leap_slot always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /_next/static/ {
            proxy_intercept_errors on;
            error_page 404 = @previous_next_static;
            proxy_pass $frontend_upstream$request_uri;
        }

        location @previous_next_static {
            proxy_pass $previous_frontend_upstream;
        }

        location / {
            proxy_pass $frontend_upstream$request_uri;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        include /etc/nginx/leap-active/slot.conf;
        location = /metrics {
            proxy_pass $api_upstream$request_uri;
        }
    }
}
